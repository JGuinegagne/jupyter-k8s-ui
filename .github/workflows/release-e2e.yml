name: 'Release: E2E'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Staging image tag (e.g. v0.2.0)'
        required: true

env:
  STAGING_REGISTRY: ghcr.io/jupyter-infra/staging
  IMAGE_NAME: jupyter-k8s-ui

jobs:
  smoke:
    name: Smoke-test staged image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    # Passed to the steps through the environment, never interpolated into `run:` scripts,
    # so a crafted version string cannot inject shell.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staged image
        run: docker pull "$STAGING_REGISTRY/$IMAGE_NAME:$VERSION"

      - name: Start container and verify health
        run: |
          CID=$(docker run -d \
            -p 8090:8090 \
            -e NODE_ENV=production \
            -e SESSION_ENABLED=false \
            -e PORT=8090 \
            "$STAGING_REGISTRY/$IMAGE_NAME:$VERSION")
          trap "docker logs $CID || true; docker stop $CID || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/api/v1/health > /dev/null; then
              echo "Health endpoint OK on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Image did not become healthy within 30s"
          exit 1

      # The image floats on oven/bun:1 and the TLS policy depends on Bun behaviour, so check
      # it on the Bun this image actually ships before it can be promoted.
      - name: Checkout smoke-test script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke-tls.ts
          sparse-checkout-cone-mode: false

      # Runs the script on the runner; the TLS checks themselves run inside the image.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify HTTPS and the TLS policy
        run: bun scripts/smoke-tls.ts "$STAGING_REGISTRY/$IMAGE_NAME:$VERSION"
